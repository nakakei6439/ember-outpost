<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#dfeaf3" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="data:," />
    <title>Ember Outpost</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud" aria-live="off">
        <div id="auto-box"><span id="auto-label">自動化 0/4</span></div>
        <button id="mute" type="button" aria-label="効果音のオンオフ">🔊</button>
        <div id="coin-box"><span class="coin-icon"></span><span class="coin-col"><span id="coins">0</span><span id="rate">+0/秒</span></span></div>
      </div>
      <div id="hint">ドラッグで動かす</div>
      <button id="debug-coins" type="button">コイン +50</button>
      <button id="retry-mini" type="button">もう一回</button>
      <div id="clear">
        <div class="clear-inner">
          <h2 id="clear-title">クリア！</h2>
          <p class="clear-msg" id="clear-msg">拠点が自分で回り始めた！</p>
          <p class="clear-time">タイム <span id="clear-time">0:00</span></p>
          <button id="more" type="button">もっと育てる</button>
          <button id="retry" type="button">もう一回</button>
          <button id="watch" type="button" class="sub">このまま眺める</button>
        </div>
      </div>
      <div id="plus"></div>
      <canvas id="confetti"></canvas>
      <div id="title">
        <div class="title-inner">
          <div class="logo-sub">エンバー・アウトポスト</div>
          <h1>Ember Outpost</h1>
          <p class="tagline">雪原のたき火拠点</p>
          <button id="start" type="button">タップしてスタート</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
